<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صانع الإجراءات | د. خالد لزجاج السيارات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<style>
:root{--bg:#eef3f4;--ink:#12232b;--mute:#5b6b72;--line:#d3dde0;--teal:#0e6aa8;--teal-d:#0a2d57;--brand-red:#3fb8dc;--red:#a3341f;--green:#1d6b3f;--card:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e171b;--ink:#e6eef0;--mute:#9fb1b7;--line:#2b3f46;--card:#16242a}}
:root[data-theme=dark]{--bg:#0e171b;--ink:#e6eef0;--mute:#9fb1b7;--line:#2b3f46;--card:#16242a}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#061230;z-index:10}
input,textarea{background:var(--card)!important}
#sheet,#sheet-pdf{--ink:#12232b;--mute:#5b6b72;--line:#d3dde0;color:#12232b}
#sheet-pdf{position:fixed;left:-10000px;top:0;width:794px;border:0;box-shadow:none;border-radius:0;direction:rtl;background:#fff;padding:28px;font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
header{background:#061230;color:#fff;padding:12px 16px;border-bottom:4px solid var(--brand-red);display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center}.logo svg{flex:none}.logo b{display:block;font-weight:900;line-height:1.2}.logo small{display:block;font-size:11px;letter-spacing:.5px;direction:ltr;text-align:right}
.logo-img{width:56px;height:56px;border-radius:50%;flex:none}#sheet .logo-img,#sheet-pdf .logo-img{width:72px;height:72px}
.dept-other{margin-top:8px}
select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card);font:inherit;color:inherit}
header h1{margin:0;font-size:19px;font-weight:900}
header p{margin:2px 0 0;font-size:13px;opacity:.85;color:#bfe6f5}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--teal)}
.btn.main{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.main:hover{background:var(--teal-d)}
.btn.warn{color:var(--red)}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
main{display:grid;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(min-width:960px){main{grid-template-columns:minmax(380px,5fr) 7fr;align-items:start}#form{max-height:calc(100vh - 140px);overflow:auto}}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin:0 0 14px}
legend{font-weight:900;color:var(--teal-d);padding:0 8px;font-size:15px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}
.hint{font-weight:400;color:var(--mute);font-size:12px;display:block}
input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfdfd}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{border:1px dashed #9db4ba;border-radius:10px;padding:10px;margin-top:10px;background:#f8fbfb}
.step .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.step .row b{color:var(--teal-d)}
.mini{border:0;background:#e3f0f8;border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:700}
.mini.del{color:var(--red)}
/* document */
#sheet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px;box-shadow:0 2px 14px rgba(18,35,43,.08)}
.doc-head{display:flex;justify-content:space-between;gap:12px;border-bottom:4px solid var(--teal);box-shadow:0 5px 0 -1px var(--brand-red);padding-bottom:12px}
.doc-head small{color:var(--teal-d);font-weight:700}
.doc-head h2{margin:2px 0 0;font-size:24px;line-height:1.3}
.code{text-align:left;direction:ltr;font-weight:900;color:var(--teal-d);white-space:nowrap}
.code span{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
.meta div{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.meta small{display:block;color:var(--mute)}
h3{margin:18px 0 4px;font-size:16px;color:var(--teal-d)}
.sec p{margin:0;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th{background:#e3f0f8;text-align:right}
th,td{border:1px solid var(--line);padding:7px 8px;vertical-align:top}
td:first-child{text-align:center;font-weight:900;color:var(--teal-d)}
.box{border-radius:10px;padding:10px 14px;margin-top:14px;font-size:14px}
.box h3{margin-top:0}
.box ul{margin:0;padding-inline-start:20px}
.red{background:#fcefec;border:1px solid #e7b3a9}.red h3{color:var(--red)}
.kpi{background:#e9f5ee;border:1px solid #a9d3b9}.kpi h3{color:var(--green)}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;font-size:13px}
.sign div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;height:84px}
.empty{color:#97a6ab}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

.tabs{display:none}
@media(max-width:959px){
 header{padding:10px 12px}header h1{font-size:17px}header p{font-size:12px}.logo-img{width:48px;height:48px}
 .bar{padding:8px 10px;gap:6px;position:static}.bar .btn{flex:1 1 auto;padding:8px 10px;font-size:14px}.bar .main{flex:2 1 100%;order:-1;font-size:16px;min-height:48px}
 .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px;background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
 .tabs button{border:2px solid var(--teal);background:var(--card);color:var(--teal);border-radius:10px;font-weight:700;min-height:44px}
 .tabs button.on{background:var(--teal);color:#fff}
 main{padding:10px}
 body[data-tab=form] #preview,body[data-tab=prev] #form{display:none}
 input,textarea,select{font-size:16px}
 .step{padding:8px}.mini{padding:8px 12px}
 .two{grid-template-columns:1fr}
 #sheet{padding:14px}#sheet .doc-head{flex-wrap:wrap}#sheet .doc-head h2{font-size:19px}#sheet .code{width:100%;text-align:right;direction:rtl}
 #sheet .sign{grid-template-columns:1fr}#sheet .sign div{height:60px}
 #sheet table{min-width:560px}
}
@media(min-width:960px){#preview{display:block!important}}
@media print{
 body{background:#fff}header,.bar,#form,#toast{display:none!important}
 main{display:block;padding:0}#sheet{border:0;box-shadow:none;padding:0}
 tr,.box,.sign{break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<main>
<section id="form" aria-label="نموذج الإدخال">
  <fieldset>
    <legend>1. بيانات الإجراء</legend>
    <label>اسم الإجراء <input data-f="title" placeholder="مثال: إجراء المشتريات غير المباشرة"></label>
    <div class="two">
      <label>الكود <input data-f="code" dir="ltr" placeholder="SOP-SCM-02"></label>
      <label>الإصدار <input data-f="ver" dir="ltr" placeholder="Draft 0.1"></label>
    </div>
    <label>الإدارة المسؤولة <select data-f="dept"><option value="">— اختر الإدارة —</option><option>سلاسل الإمداد — المشتريات المباشرة والاستيراد</option><option>سلاسل الإمداد — المشتريات غير المباشرة</option><option>العمليات والفروع والفانات</option><option>التجاري والكول سنتر 19465</option><option>الجودة الفنية والتدريب (Master Tech)</option><option>المالية والمراجعة الداخلية</option><option>الموارد البشرية والإدارة</option><option>تقنية المعلومات وأنظمة ERP</option><option value="__other">أخرى (اكتبها)</option></select></label>
    <input class="dept-other" data-f="deptOther" placeholder="اكتب اسم الإدارة" hidden>
  </fieldset>

  <fieldset>
    <legend>2. من يفعل ماذا؟</legend>
    <label>من يعتمد القرار ويتحمل النتيجة؟ <span class="hint">شخص واحد فقط (A)</span><input data-f="a"></label>
    <label>من ينفذ الخطوات؟ <span class="hint">(R)</span><input data-f="r"></label>
    <label>من نستشيره قبل القرار؟ <span class="hint">(C)</span><input data-f="c"></label>
    <label>من نبلغه بعد القرار؟ <span class="hint">(I)</span><input data-f="i"></label>
  </fieldset>

  <fieldset>
    <legend>3. الهدف والنطاق</legend>
    <label>لماذا هذا الإجراء؟ <span class="hint">ما المشكلة التي يحلها؟</span><textarea data-f="purpose" rows="3"></textarea></label>
    <label>على من وأين يُطبق؟ <textarea data-f="scope" rows="2"></textarea></label>
    <label>النماذج والمستندات المطلوبة <textarea data-f="inputs" rows="2"></textarea></label>
  </fieldset>

  <fieldset>
    <legend>4. الخطوات</legend>
    <div id="steps"></div>
    <button class="btn" style="margin-top:10px" onclick="addStep()">+ أضف خطوة</button>

  <fieldset>
    <legend>5. الممنوعات <span class="hint">كل قاعدة في سطر</span></legend>
    <textarea data-f="red" rows="4"></textarea>
  </fieldset>
  <fieldset>
    <legend>6. كيف نقيس النجاح؟ <span class="hint">كل مؤشر في سطر بأرقام</span></legend>
    <textarea data-f="kpi" rows="4"></textarea>
  </fieldset>
</section>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const KEY='dk-sop-v1';
const FIELDS=['title','code','ver','dept','deptOther','a','r','c','i','purpose','scope','inputs','red','kpi'];
let S=load();

function blank(){const o={steps:[{stage:'',action:'',owner:'',proof:''}]};FIELDS.forEach(f=>o[f]='');return o}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.steps)return v}catch(e){}return blank()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines=t=>String(t||'').split('\n').map(l=>l.replace(/^[•\-*]\s*/,'').trim()).filter(Boolean);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

const deptName=()=>S.dept==='__other'?(S.deptOther||''):(S.dept||'');
const PFX={'سلاسل':'SCM','العمليات':'RET','التجاري':'COM','الجودة':'QA','المالية':'FIN','الموارد':'HR','تقنية':'IT'};
function syncDept(){const sel=document.querySelector('[data-f="dept"]'),o=document.querySelector('[data-f="deptOther"]');o.hidden=S.dept!=='__other'}
function fillForm(){const sel=document.querySelector('[data-f="dept"]');
  if(S.dept&&![...sel.options].some(o=>o.value===S.dept||o.text===S.dept)){S.deptOther=S.dept;S.dept='__other'}
  FIELDS.forEach(f=>document.querySelector(`[data-f="${f}"]`).value=S[f]||'');syncDept();renderSteps();renderSheet()}

function renderSteps(){
  document.getElementById('steps').innerHTML=S.steps.map((s,i)=>`
  <div class="step">
    <div class="row"><b>الخطوة ${i+1}</b>
      <span>
        <button class="mini" onclick="moveStep(${i},-1)" aria-label="لأعلى">▲</button>
        <button class="mini" onclick="moveStep(${i},1)" aria-label="لأسفل">▼</button>
        <button class="mini del" onclick="delStep(${i})">حذف</button>
      </span></div>
    <label>اسم الخطوة <input value="${esc(s.stage)}" data-s="${i}.stage"></label>
    <label>ماذا يحدث بالتفصيل؟ <textarea rows="2" data-s="${i}.action">${esc(s.action)}</textarea></label>
    <div class="two">
      <label>من المسؤول؟ <input value="${esc(s.owner)}" data-s="${i}.owner"></label>
      <label>المدة / الإثبات <input value="${esc(s.proof)}" data-s="${i}.proof"></label>
    </div>
  </div>`).join('')||'<p class="empty">لا توجد خطوات بعد.</p>';
}
function addStep(){S.steps.push({stage:'',action:'',owner:'',proof:''});renderSteps();renderSheet();persist()}
function delStep(i){S.steps.splice(i,1);renderSteps();renderSheet();persist()}
function moveStep(i,d){const j=i+d;if(j<0||j>=S.steps.length)return;[S.steps[i],S.steps[j]]=[S.steps[j],S.steps[i]];renderSteps();renderSheet();persist()}

document.addEventListener('input',e=>{
  const f=e.target.dataset.f,s=e.target.dataset.s;
  if(f){S[f]=e.target.value;if(f==='dept'){syncDept();const p=PFX[S.dept.split(' ')[0]];if(p&&!S.code){S.code='SOP-'+p+'-01';document.querySelector('[data-f="code"]').value=S.code}}}
  else if(s){const[i,k]=s.split('.');S.steps[+i][k]=e.target.value}
  else return;
  renderSheet();persist();
});

function renderSheet(){
  const v=(x,d='—')=>esc(x)||`<span class="empty">${d}</span>`;
  const ci=[S.c&&'يُستشار: '+esc(S.c),S.i&&'يُبلَّغ: '+esc(S.i)].filter(Boolean).join(' — ');
  const list=t=>lines(t).map(l=>`<li>${esc(l)}</li>`).join('');
  const rows=S.steps.map((s,i)=>`<tr><td>${i+1}</td><td><b>${esc(s.stage)||'—'}</b></td><td>${esc(s.action)||'—'}</td><td>${esc(s.owner)||'—'}</td><td>${esc(s.proof)||'—'}</td></tr>`).join('');

async function exportPDF(){
  const btn=document.getElementById('pdfBtn');
  if(!window.html2canvas||!window.jspdf){toast('تعذر تحميل أدوات PDF، تأكد من الاتصال بالإنترنت');return}
  const old=btn.textContent;btn.disabled=true;btn.textContent='جارٍ التجهيز…';
  let clone;
  try{
    await document.fonts.ready;
    clone=document.getElementById('sheet').cloneNode(true);clone.id='sheet-pdf';
    document.body.appendChild(clone);
    const k=2,cv=await html2canvas(clone,{scale:k,backgroundColor:'#fff',useCORS:true});
    const cr=clone.getBoundingClientRect();
    const cuts=[...clone.querySelectorAll('tr,.box,h3,.sign,.meta')].map(e=>(e.getBoundingClientRect().top-cr.top)*k).sort((a,b)=>a-b);
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'});
    const M=10,cw=210-2*M,mm=cw/cv.width,pageH=Math.floor((297-2*M)/mm);
    let y=0,first=true;
    while(y<cv.height-2){
      let end=Math.min(y+pageH,cv.height);
      if(end<cv.height){const c=cuts.filter(t=>t>y+pageH*0.5&&t<=y+pageH).pop();if(c)end=c}
      const h=end-y,pc=document.createElement('canvas');pc.width=cv.width;pc.height=h;
      const cx=pc.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,pc.width,h);
      cx.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(!first)pdf.addPage();first=false;
      pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',M,M,cw,h*mm);
      y=end;
    }
    const name=((S.code||'SOP').replace(/[^\w\-]+/g,'_'))+'.pdf';
    const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:pdf.output('blob')});toast('تم حفظ الملف')}
    else{pdf.save(name);toast('تم تحميل الملف')}
  }catch(e){if(!e||e.code!=='declined')toast('تعذر إنشاء الملف، حاول مرة أخرى')}
  finally{if(clone)clone.remove();btn.disabled=false;btn.textContent=old}
}

fillForm();
</script>
